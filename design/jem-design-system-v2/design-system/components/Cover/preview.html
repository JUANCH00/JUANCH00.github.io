<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; inset: 0; }
  .accent { fill: var(--accent); }
  .ink { fill: var(--text); }
  .dim { fill: var(--text-dim); }
  .soft { fill: var(--text-soft); }
  .glyph { fill: var(--bg); font-family: var(--font-display); font-size: 360px; }
  .rule { stroke: var(--line-strong); stroke-width: 1; }
  .blk { rx: var(--radius-none); }
  .name { position: absolute; left: 48px; bottom: 48px; max-width: 400px; }
  .name h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 80px; line-height: 0.95; color: var(--text); }
  .name p { margin: 16px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.4; color: var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: accent 256x300 (bleeds top and bottom), text 208x160 (bleeds top/right), text-dim 112x108, text-soft 80x64; sides from space-9 (64) multiples, gaps space-4 (16)
      arrangement: one tall accent slab with three satellites to its right, flush grid, bleeding off the top and right edges
      pattern: one oversized display glyph, the J of the favicon, cut from the accent slab in bg; chosen because Anton poster type IS the brand's image
      steps and radii: space-4 16, space-9 64, radius-none on every block
    -->
    <rect class="accent blk" x="480" y="0" width="256" height="300"/>
    <clipPath id="slab"><rect x="480" y="0" width="256" height="300"/></clipPath>
    <text class="glyph" x="548" y="318" clip-path="url(#slab)">J</text>
    <rect class="ink blk" x="752" y="0" width="208" height="160"/>
    <rect class="dim blk" x="752" y="176" width="112" height="124"/>
    <rect class="soft blk" x="880" y="176" width="80" height="64"/>
  </svg>
  <div class="name">
    <h1>JEM<br>Portfolio</h1>
    <p>Poster type on near-black, one hot accent, hairlines instead of boxes.</p>
  </div>
</div>
</body>
</html>
