<!-- @dsCard group="Content" height=400 subtitle="Escenario estático; en el sitio es interactivo" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LabCard preview</title></head>
<body>
<div class="jem-pad">
<article class="jem-lab" style="max-width:520px">
  <div class="jem-lab__head">
    <h3 class="jem-lab__title">Penalty shootout</h3>
    <span class="jem-meta">Keeper accuracy 54%</span>
  </div>
  <p class="jem-lab__blurb">My World Cup model calls matches at 54%. The keeper guesses with the same odds. Pick a corner and try to beat it.</p>
  <div class="jem-lab__stage" role="img" aria-label="Goal with keeper">
    <div style="position:absolute;inset:16px 8% 64px;border:3px solid var(--text);border-bottom:0"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--surface-raised);border-top:1px solid var(--line)"></div>
    <div style="position:absolute;left:50%;bottom:64px;width:48px;height:84px;margin-left:-24px;background:var(--accent)"></div>
    <div style="position:absolute;left:50%;bottom:22px;width:18px;height:18px;margin-left:-9px;border-radius:var(--radius-full);background:var(--text)"></div>
  </div>
  <div class="jem-lab__foot"><span class="jem-meta">Pick a corner</span><span class="jem-meta" style="font-variant-numeric:tabular-nums">Goals 0, saves 0</span></div>
</article>
</div>
</body>
</html>
